<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeerFlow 运行监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 24px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        .status-dot.disconnected { background: #ef4444; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text { font-size: 0.75rem; color: #94a3b8; }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .card-title {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .card-meta {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
        }
        .card-meta span { color: #fbbf24; }
        .progress-bar {
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #22c55e, #38bdf8);
            transition: width 0.5s ease;
        }
        .progress-fill.warning { background: linear-gradient(90deg, #fbbf24, #f97316); }
        .progress-fill.danger { background: linear-gradient(90deg, #f97316, #ef4444); }
        .chart-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .chart-title { font-size: 1rem; color: #e2e8f0; }
        .chart-legend {
            display: flex; gap: 16px; flex-wrap: wrap;
        }
        .legend-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75rem; color: #94a3b8;
        }
        .legend-color {
            width: 12px; height: 3px; border-radius: 2px;
        }
        canvas { max-height: 350px; }
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        .resource-panel { margin-top: 24px; }
        .resource-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .resource-table th, .resource-table td { padding: 10px 8px; border-bottom: 1px solid #334155; text-align: left; }
        .resource-table th { color: #94a3b8; font-weight: 600; }
        .resource-table td { color: #cbd5e1; }
        .resource-table .failure { color: #f87171; font-weight: 600; }
        .resource-table .healthy { color: #34d399; font-weight: 600; }
        .resource-id { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: nowrap; color: #93c5fd; }
        .resource-note { color: #94a3b8; font-size: 0.75rem; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>DeerFlow 运行监控</h1>
    <p class="subtitle">Docker 容器内存与 MMKB 资源链接诊断</p>
    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">连接中...</span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="chart-container">
        <div class="chart-header">
            <span class="chart-title">内存使用趋势（最近 5 分钟）</span>
            <div class="chart-legend" id="legend"></div>
        </div>
        <canvas id="chart"></canvas>
    </div>
    <div class="chart-container resource-panel">
        <div class="chart-header">
            <span class="chart-title">MMKB 资源与上下文诊断事件</span>
        </div>
        <p class="resource-note">文档页需要登录会话和匹配的当前 workspace；面板仅展示脱敏计数与公开 base URL 来源，不保存文档 ID、签名 token 或 bearer token。</p>
        <div id="resourceEvents" class="no-data">暂无 MMKB 诊断事件</div>
    </div>

    <script>
    const COLORS = ['#38bdf8', '#a78bfa', '#34d399', '#fbbf24', '#f87171', '#fb923c'];
    const MAX_POINTS = 300;

    // Chart setup
    const ctx = document.getElementById('chart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: {
            responsive: true,
            animation: false,
            interaction: { intersect: false, mode: 'index' },
            scales: {
                x: {
                    display: true,
                    grid: { color: '#1e293b' },
                    ticks: { color: '#64748b', maxTicksLimit: 10 }
                },
                y: {
                    display: true,
                    grid: { color: '#334155' },
                    ticks: {
                        color: '#64748b',
                        callback: v => formatBytes(v)
                    },
                    beginAtZero: true
                }
            },
            plugins: { legend: { display: false } }
        }
    });

    // State
    const history = {};  // container -> [{usage, timestamp}]
    let colorMap = {};
    let colorIdx = 0;

    function getColor(name) {
        if (!colorMap[name]) {
            colorMap[name] = COLORS[colorIdx % COLORS.length];
            colorIdx++;
        }
        return colorMap[name];
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function formatTime(ts) {
        const d = new Date(ts * 1000);
        return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[ch]);
    }

    function shortId(value) {
        const text = String(value || '').trim();
        if (!text || text === '-') return '-';
        if (text.length <= 18) return text;
        return `${text.slice(0, 10)}…${text.slice(-6)}`;
    }

    function idCell(value) {
        const text = String(value || '').trim();
        if (!text || text === '-') return '-';
        return `<span class="resource-id" title="${escapeHtml(text)}">${escapeHtml(shortId(text))}</span>`;
    }

    function updateCards(snapshot) {
        const container = document.getElementById('cards');
        container.innerHTML = '';
        for (const [name, data] of Object.entries(snapshot)) {
            const pct = data.limit > 0 ? (data.usage / data.limit * 100) : 0;
            const pctClass = pct > 80 ? 'danger' : pct > 60 ? 'warning' : '';
            const shortName = name.replace(/^(deer[-_]?flow[-_]?)/, '');
            container.innerHTML += `
                <div class="card">
                    <div class="card-title">${shortName}</div>
                    <div class="card-value">${formatBytes(data.usage)}</div>
                    <div class="card-meta">
                        峰值: <span>${formatBytes(data.peak)}</span>
                        ${data.limit > 0 ? ` / 上限: ${formatBytes(data.limit)}` : ''}
                    </div>
                    ${data.limit > 0 ? `
                    <div class="progress-bar">
                        <div class="progress-fill ${pctClass}" style="width:${pct.toFixed(1)}%"></div>
                    </div>` : ''}
                </div>`;
        }
    }

    function updateChart() {
        const names = Object.keys(history);
        if (names.length === 0) return;

        // Use timestamps from the first container as labels
        const refHistory = history[names[0]] || [];
        chart.data.labels = refHistory.map(p => formatTime(p.timestamp));

        chart.data.datasets = names.map(name => ({
            label: name,
            data: (history[name] || []).map(p => p.usage),
            borderColor: getColor(name),
            backgroundColor: getColor(name) + '20',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
            fill: true
        }));
        chart.update('none');

        // Update legend
        const legendEl = document.getElementById('legend');
        legendEl.innerHTML = names.map(name => `
            <div class="legend-item">
                <div class="legend-color" style="background:${getColor(name)}"></div>
                ${name.replace(/^(deer[-_]?flow[-_]?)/, '')}
            </div>`).join('');
    }

    // WebSocket connection
    function connect() {
        const ws = new WebSocket(`ws://${location.host}/ws/stats`);
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');

        ws.onopen = () => {
            dot.classList.remove('disconnected');
            text.textContent = '已连接 - 实时监控中';
        };
        ws.onclose = () => {
            dot.classList.add('disconnected');
            text.textContent = '已断开 - 3秒后重连...';
            setTimeout(connect, 3000);
        };
        ws.onerror = () => ws.close();

        ws.onmessage = (event) => {
            const snapshot = JSON.parse(event.data);
            // Append to history
            for (const [name, data] of Object.entries(snapshot)) {
                if (!history[name]) history[name] = [];
                history[name].push({ usage: data.usage, timestamp: data.timestamp });
                if (history[name].length > MAX_POINTS) {
                    history[name].shift();
                }
            }
            updateCards(snapshot);
            updateChart();
        };
    }

    async function updateResourceEvents() {
        try {
            const response = await fetch('/api/mmkb-resource-events');
            const events = await response.json();
            const target = document.getElementById('resourceEvents');
            if (!events.length) {
                target.className = 'no-data';
                target.textContent = '暂无 MMKB 诊断事件';
                return;
            }
            target.className = '';
            target.innerHTML = `<table class="resource-table">
                <thead><tr><th>时间</th><th>层级 / 工具</th><th>线程</th><th>运行</th><th>状态</th><th>公开地址来源</th><th>公开地址</th><th>媒体异常</th><th>文档页</th><th>源站异常</th><th>会话依赖</th></tr></thead>
                <tbody>${events.map(item => {
                    const f = item.fields || {};
                    const mediaFailures = Number(f.malformed_signed || 0) + Number(f.protected_unsigned || 0);
                    const apiDocumentDetails = Number(f.api_document_detail_urls || 0);
                    const documentFailures = Number(f.malformed_document_pages || 0) + apiDocumentDetails;
                    const statusClass = item.has_failures ? 'failure' : 'healthy';
                    let statusText = item.has_failures ? '异常' : '结构正常';
                    if (item.event === 'mmkb_runtime_context') {
                        statusText = f.fallback_used === 'true' ? 'Fallback' : '上下文正常';
                    } else if (item.event === 'deerflow_run_context_merge') {
                        statusText = item.has_failures ? '缺少公开地址' : '合并正常';
                    }
                    const publicSource = f.public_base_url_source || (f.incoming_public_base_url_present === 'true' ? 'incoming_context' : '-');
                    const candidates = [f.public_base_url, f.context_public_base_url, f.incoming_public_base_url]
                        .filter(value => value && value !== '-');
                    const publicBaseUrl = candidates[0] || '-';
                    return `<tr>
                        <td>${escapeHtml(item.timestamp || '-')}</td>
                        <td>${escapeHtml(item.event)}${f.tool ? ` / ${escapeHtml(f.tool)}` : ''}</td>
                        <td>${idCell(f.thread_id)}</td>
                        <td>${idCell(f.run_id)}</td>
                        <td class="${statusClass}">${escapeHtml(statusText)}</td>
                        <td>${escapeHtml(publicSource)}</td>
                        <td>${escapeHtml(publicBaseUrl)}</td>
                        <td>${mediaFailures}</td>
                        <td>${f.document_page_urls || 0}${documentFailures ? ` / 格式异常 ${documentFailures}` : ''}${apiDocumentDetails ? ` / API端点 ${apiDocumentDetails}` : ''}</td>
                        <td>${f.unexpected_document_origins || 0}</td>
                        <td>${f.document_pages_require_session || 0}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table>`;
        } catch (_) {
            document.getElementById('resourceEvents').textContent = '资源校验事件读取失败';
        }
    }

    connect();
    updateResourceEvents();
    setInterval(updateResourceEvents, 3000);
    </script>
</body>
</html>
