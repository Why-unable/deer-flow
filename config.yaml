config_version: 36
log_level: info
token_usage:
  enabled: true
models:
- name: alibaba-maas-default
  display_name: 阿里云百炼 Qwen Plus
  use: langchain_openai:ChatOpenAI
  model: $ALIBABA_MAAS_MODEL
  api_key: $ALIBABA_MAAS_API_KEY
  base_url: https://llm-mqmqrcag3tduxb79.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 16000
  temperature: 0.7
  supports_thinking: false
  supports_vision: false
- name: qwen3.7-max
  display_name: 通义千问 Qwen3.7 Max
  use: langchain_openai:ChatOpenAI
  model: qwen3.7-max
  api_key: $ALIBABA_MAAS_API_KEY
  base_url: https://llm-mqmqrcag3tduxb79.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 16000
  temperature: 0.7
  supports_thinking: false
  supports_vision: false
- name: qwen3.7-max-2026-06-08
  display_name: 通义千问 Qwen3.7 Max 2026-06-08
  use: langchain_openai:ChatOpenAI
  model: qwen3.7-max-2026-06-08
  api_key: $ALIBABA_MAAS_API_KEY
  base_url: https://llm-mqmqrcag3tduxb79.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 16000
  temperature: 0.7
  supports_thinking: false
  supports_vision: true
- name: qwen3.7-plus
  display_name: 通义千问 Qwen3.7 Plus
  use: langchain_openai:ChatOpenAI
  model: qwen3.7-plus
  api_key: $ALIBABA_MAAS_API_KEY
  base_url: https://llm-mqmqrcag3tduxb79.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 16000
  temperature: 0.7
  supports_thinking: false
  supports_vision: false
- name: qwen3.6-flash
  display_name: 通义千问 Qwen3.6 Flash
  use: langchain_openai:ChatOpenAI
  model: qwen3.6-flash
  api_key: $ALIBABA_MAAS_API_KEY
  base_url: https://llm-mqmqrcag3tduxb79.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 16000
  temperature: 0.7
  supports_thinking: false
  supports_vision: false
tool_groups:
- name: web
- name: knowledge
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: rag_list_documents
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_list_documents_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_search
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_search_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_get_document
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_get_document_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_get_document_preview
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_get_document_preview_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_get_document_chunks
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_get_document_chunks_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_get_document_assets
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_get_document_assets_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_get_document_asset
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_get_document_asset_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: rag_list_collections
  group: knowledge
  use: deerflow.tools.custom.rag.tools:rag_list_collections_tool
  base_url: http://host.docker.internal
  public_base_url_fallback: http://rag.mmkb
  timeout: 30
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
tool_search:
  enabled: false
  auto_promote_top_k: 3
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  tool_freq_overrides:
    rag_get_document_asset:
      warn: 8
      hard_limit: 12
    rag_get_document_assets:
      warn: 10
      hard_limit: 16
safety_finish_reason:
  enabled: true
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  bash_command_timeout: 600
subagents:
  timeout_seconds: 900
  max_turns: 160
  agents:
    general-purpose:
      timeout_seconds: 1800
      max_turns: 160
skills:
  container_path: /mnt/skills
title:
  enabled: false
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 32000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: false
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
  shutdown_flush_timeout_seconds: 30.0
  manager_class: deermem
  mode: middleware
  backend_config:
    storage_path: ''
    storage_class: file
    strict_user_scope: false
    manifest_filename: memory.json
    file_lock_timeout_seconds: 10
    retrieval_adapter: fts5
    debounce_seconds: 30
    queue_max_depth: 1000
    model: null
    max_facts: 100
    fact_confidence_threshold: 0.7
    fact_eviction_policy: confidence
    fact_eviction_shadow_enabled: false
    eviction_confidence_weight: 0.65
    eviction_confirmation_weight: 0.25
    eviction_access_weight: 0.1
    eviction_confirmation_half_life_days: 90
    eviction_access_half_life_days: 30
    eviction_correction_reserved_fraction: 0.1
    eviction_correction_reserved_max: 10
    eviction_audit_max_entries: 200
    max_injection_tokens: 2000
    token_counting: tiktoken
    guaranteed_categories:
    - correction
    guaranteed_token_budget: 500
    staleness_review_enabled: true
    staleness_age_days: 90
    staleness_min_candidates: 3
    staleness_max_removals_per_cycle: 10
    staleness_protected_categories:
    - correction
    staleness_max_lifetime_multiplier: 20.0
    staleness_max_extension_days: 3650
    consolidation_enabled: false
    consolidation_min_facts: 8
    consolidation_max_groups_per_cycle: 3
    consolidation_max_sources: 8
agents_api:
  enabled: false
skill_evolution:
  enabled: false
  moderation_model_name: null
  security_fail_closed: true
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
  pool_recycle: 300
  command_timeout: 30
  checkpoint_channel_mode: full
  checkpoint_delta:
    snapshot_frequency: 10
  checkpoint_graph_cache:
    accessor_graph_max: 64
run_events:
  backend: db
  max_trace_content: 10240
  track_token_usage: true
logging:
  enhance:
    enabled: false
    format: text
token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0
max_recursion_limit: 1000
suggestions:
  enabled: true
  max_suggestions: 3
input_polish:
  enabled: true
  max_chars: 4000
  model_name: null
read_before_write:
  enabled: true
subagent_runtime:
  max_running: 3
  max_queued: 64
  admission_policy: queue
  queue_timeout_seconds: 300
subagent_batches:
  enabled: false
  poll_interval_seconds: 1
  lease_seconds: 120
  max_items_per_batch: 5000
  default_max_live_items: 100
  max_live_items_per_batch: 1000
  default_max_running_items: 3
  max_running_items_per_batch: 64
  max_attempts: 3
  max_result_chars: 100000
  result_preview_max_chars: 2000
verification:
  receipts_enabled: true
  receipts_render_mode: delegation_only
  judge_enabled: false
  judge_model_name: null
skill_scan:
  enabled: true
agent_storage:
  backend: file
scheduler:
  enabled: false
  multi_instance: false
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_runs: 3
  queue_timeout_seconds: 3600
  min_once_delay_seconds: 60
  recursion_limit: 1000
mcp_tasks:
  enabled: false
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_polls: 8
  max_poll_backoff_seconds: 300
  input_required_poll_interval_seconds: 60
  tracking_degraded_after_errors: 3
  max_result_bytes: 65536
  result_preview_max_chars: 2000
run_ownership:
  lease_seconds: 30
  grace_seconds: 10
  heartbeat_enabled: false
authorization:
  enabled: false
